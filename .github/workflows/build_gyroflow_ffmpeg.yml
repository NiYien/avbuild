name: Build Gyroflow FFmpeg

on:
  workflow_dispatch:
  push:
    branches: [codex/ffmpeg-9-custom]

permissions:
  contents: read

concurrency:
  group: gyroflow-ffmpeg-9.0-macos
  cancel-in-progress: false

env:
  FF_VERSION: '9.0'
  FF_COMMIT: '946fcce07b6dcd0331c8cc609192aeff5e1924f8'
  FFREPO: 'https://github.com/FFmpeg/FFmpeg.git'
  TARGET_OS: macOS
  CONFIG_SUFFIX: -gpl-lite
  NINJA_STATUS: '[%f/%t %e %r]'

jobs:
  macos-universal:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@v5

    - name: Create build environment
      shell: bash
      run: |
        ./tools/ci-before-build.sh
        wget https://sourceforge.net/projects/avbuild/files/dep/dep_gpl.7z/download -O dep_gpl.7z
        7z x -y dep_gpl.7z -otools

    - name: Build macOS universal GPL-lite SDK
      shell: bash
      run: |
        export FFSRC=$PWD/ffmpeg-${FF_VERSION}
        ./avbuild.sh macOS10.15

    - name: Verify VideoToolbox color ownership fix
      shell: bash
      run: |
        set -euo pipefail
        python3 tools/verify-videotoolbox-color-fix.py "ffmpeg-${FF_VERSION}"
        sdk=$(echo sdk-*)
        "$sdk/bin/ffmpeg" -hide_banner -h decoder=hevc 2>&1 | grep tile_interleave

    - name: Verify universal libraries and VideoToolbox encoders
      shell: bash
      run: |
        set -euo pipefail
        exec > >(tee verification.txt) 2>&1
        set -x
        libs=(sdk-*/lib/libavcodec.a)
        test "${#libs[@]}" -eq 1
        lib=${libs[0]}
        lipo -info "$lib"
        archs=" $(lipo -archs "$lib") "
        for arch in x86_64 arm64; do
          test "${archs#* $arch }" != "$archs"
          nm -arch "$arch" "$lib" > "nm-${arch}.txt"
          for codec in h264 hevc prores; do
            symbol="_ff_${codec}_videotoolbox_encoder"
            echo "Checking ${symbol} in ${arch}"
            grep -F "$symbol" "nm-${arch}.txt"
          done
        done
        for dependency in x264 x265; do
          dependency_lib="tools/dep_gpl/${TARGET_OS}/lib/lib${dependency}.a"
          lipo -info "$dependency_lib"
          dependency_archs=" $(lipo -archs "$dependency_lib") "
          for arch in x86_64 arm64; do
            test "${dependency_archs#* $arch }" != "$dependency_archs"
          done
        done

    - name: Exercise repeated VideoToolbox sessions on macOS
      shell: bash
      run: |
        set -euo pipefail
        sdk=$(echo sdk-*)
        clang tools/test-videotoolbox-reopen.c -I"$sdk/include" \
          "$sdk/lib/libavcodec.dylib" "$sdk/lib/libavutil.dylib" \
          -framework CoreFoundation -framework CoreVideo \
          -Wl,-rpath,"$PWD/$sdk/lib" -o test-videotoolbox-reopen
        DYLD_LIBRARY_PATH="$PWD/$sdk/lib" MallocScribble=1 \
          ./test-videotoolbox-reopen 2>&1 | tee videotoolbox-reopen.txt

    - name: Package SDK
      shell: bash
      run: |
        cp -avf tools/dep_gpl/${TARGET_OS}/lib/* sdk-*/lib/
        GITHUB_EVENT_NAME=pull_request ./tools/ci-after-build.sh
        shasum -a 256 ffmpeg-*.tar.xz > SHA256SUMS.txt
        cat SHA256SUMS.txt

    - name: Upload SDK
      uses: actions/upload-artifact@v4
      with:
        name: ffmpeg-${{ env.FF_VERSION }}-${{ env.TARGET_OS }}-gpl-lite
        path: |
          ffmpeg-*.tar.xz
          SHA256SUMS.txt
          verification.txt
          videotoolbox-reopen.txt
        if-no-files-found: error
        retention-days: 30

    - name: Upload diagnostics on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ffmpeg-${{ env.FF_VERSION }}-${{ env.TARGET_OS }}-diagnostics
        path: |
          sdk-*/config*.log
          nm-*.txt
          verification.txt
          videotoolbox-reopen.txt
        if-no-files-found: ignore
        retention-days: 7
